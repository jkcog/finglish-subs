<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Finglish Subs – Practice</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    nav button { font: inherit; padding: 6px 14px; margin-right: 6px; border: 1px solid #bbb; background: #f4f4f4; border-radius: 6px; cursor: pointer; }
    nav button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; margin-top: 16px; text-align: center; }
    .fa { font-size: 44px; direction: rtl; margin: 8px 0; }
    .ctx { direction: rtl; color: #555; margin: 8px 0 16px; }
    .answer { margin-top: 12px; }
    .fi { font-size: 24px; color: #8a6d00; font-weight: 600; }
    .gloss { font-size: 18px; margin-top: 4px; }
    .actions button { font: inherit; padding: 8px 20px; margin: 12px 6px 0; border-radius: 8px; border: 1px solid #bbb; cursor: pointer; background: #f4f4f4; }
    .actions .good { background: #2d7a2d; color: #fff; border-color: #2d7a2d; }
    .actions .again { background: #b3382c; color: #fff; border-color: #b3382c; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    td.fa-cell { font-size: 20px; direction: rtl; text-align: right; }
    td input { width: 100%; box-sizing: border-box; font: inherit; padding: 4px 6px; }
    .muted { color: #777; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Practice words</h1>
  <nav>
    <button id="tabReview" class="on">Review</button>
    <button id="tabList">All words</button>
  </nav>

  <section id="review">
    <label class="muted"><input type="checkbox" id="hintFi"> Show Finglish with the question</label>
    <div id="reviewBody"></div>
  </section>

  <section id="list" hidden>
    <p><button id="exportCsv">Export CSV (for Anki / spreadsheets)</button></p>
    <div id="listBody"></div>
  </section>

  <script src="practice.js"></script>
</body>
</html>
