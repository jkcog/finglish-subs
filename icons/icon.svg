<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- Persian letter "ف" (f) on the left side -->
  <text x="40" y="82" text-anchor="middle" font-family="Noto Naskh Arabic, Noto Sans Arabic, DejaVu Sans, sans-serif" font-size="66" font-weight="700" fill="#ffffff">ف</text>
  <!-- Latin "F" on the right side, highlighted, to suggest the transliteration -->
  <text x="92" y="82" text-anchor="middle" font-family="Roboto, Arial, DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#ffe066">F</text>
  <!-- Subtitle bar -->
  <rect x="26" y="98" width="76" height="8" rx="4" fill="#ffe066" opacity="0.85"/>
</svg>
